---
- name: SSH Security Hardening
  hosts: local
  become: yes
  vars:
    ssh_config_file: /etc/ssh/sshd_config
    ssh_backup_file: /etc/ssh/sshd_config.backup
    
  tasks:
    - name: Create backup of original SSH config
      copy:
        src: "{{ ssh_config_file }}"
        dest: "{{ ssh_backup_file }}"
        backup: yes
      
    - name: Disable root login via SSH
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        backup: yes
      notify: restart ssh
      
    - name: Disable password authentication
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        backup: yes
      notify: restart ssh
      
    - name: Enable public key authentication
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        backup: yes
      notify: restart ssh
      
    - name: Disable empty passwords
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        backup: yes
      notify: restart ssh
      
    - name: Set maximum authentication attempts
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
        backup: yes
      notify: restart ssh
      
    - name: Set client alive interval
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        backup: yes
      notify: restart ssh
      
    - name: Set client alive count max
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?ClientAliveCountMax'
        line: 'ClientAliveCountMax 2'
        backup: yes
      notify: restart ssh
      
    - name: Disable X11 forwarding
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
        backup: yes
      notify: restart ssh
      
    - name: Set SSH protocol version 2
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?Protocol'
        line: 'Protocol 2'
        backup: yes
      notify: restart ssh
      
    - name: Configure allowed users (create security group)
      group:
        name: ssh-users
        state: present
        
    - name: Add current user to ssh-users group
      user:
        name: "{{ ansible_user_id }}"
        groups: ssh-users
        append: yes
        
    - name: Restrict SSH access to ssh-users group
      lineinfile:
        path: "{{ ssh_config_file }}"
        regexp: '^#?AllowGroups'
        line: 'AllowGroups ssh-users'
        backup: yes
      notify: restart ssh
      
  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted
