---
- name: Install security packages
  apt:
    name:
      - fail2ban
      - unattended-upgrades
    state: present
    update_cache: yes

- name: Configure fail2ban
  copy:
    content: |
      [sshd]
      enabled = true
      maxretry = 3
      bantime = 3600
    dest: /etc/fail2ban/jail.d/ssh.conf
  notify: restart fail2ban

- name: Start security services
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - fail2ban
