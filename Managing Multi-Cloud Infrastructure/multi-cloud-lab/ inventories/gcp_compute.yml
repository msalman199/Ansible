---
plugin: google.cloud.gcp_compute
projects:
  - YOUR_PROJECT_ID
auth_kind: serviceaccount
service_account_file: ~/multi-cloud-lab/credentials/gcp-key.json
filters:
  - labels.managed-by = ansible
  - status = RUNNING
keyed_groups:
  - key: labels.environment | default('unknown')
    prefix: env
  - key: labels.cloud | default('unknown')
    prefix: cloud
  - key: zone
    prefix: zone
hostnames:
  - public_ip
  - name
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP | default(networkInterfaces[0].networkIP)
  ansible_user: ubuntu
  ansible_ssh_private_key_file: ~/multi-cloud-lab/credentials/gcp-key
