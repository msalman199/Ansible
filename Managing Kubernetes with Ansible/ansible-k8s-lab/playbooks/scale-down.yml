---
- name: Scale Down Kubernetes Deployment
  hosts: local
  gather_facts: no
  vars:
    namespace_name: "ansible-demo"
    app_name: "nginx-app"
    new_replica_count: 2
  
  tasks:
    - name: Scale down deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ namespace_name }}"
          spec:
            replicas: "{{ new_replica_count }}"
    
    - name: Wait for scale down to complete
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ namespace_name }}"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
      register: scaled_down_deployment
    
    - name: Display scale down result
      debug:
        msg: "Deployment scaled down to {{ scaled_down_deployment.resources[0].status.readyReplicas }} replicas"
