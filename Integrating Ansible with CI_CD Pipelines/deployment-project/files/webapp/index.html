<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Deployment Success</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .success { color: green; font-size: 24px; }
        .info { color: blue; margin-top: 20px; }
    </style>
</head>
<body>

</html>
